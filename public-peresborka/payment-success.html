<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Оплата подтверждается — «Пересборка»</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #0b1821; --paper: #f5f1e9; --gold: #d8ae63; --divider: rgba(11,24,33,0.16); --muted: #66717a; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--paper); font-family: Manrope, Arial, sans-serif; }
    .status-card { max-width: 420px; width: 100%; background: #fff; border: 1px solid var(--divider); border-radius: 20px; padding: 36px 32px; text-align: center; box-shadow: 0 12px 32px -12px rgba(11,24,33,0.18); }
    .status-card__spinner { width: 36px; height: 36px; margin: 0 auto 20px; border-radius: 50%; border: 3px solid var(--divider); border-top-color: var(--gold); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-card__title { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 1.3rem; margin: 0 0 10px; color: var(--ink); }
    .status-card__text { color: var(--muted); font-size: 0.92rem; line-height: 1.6; margin: 0; }
    .status-card__hint { color: var(--muted); font-size: 0.84rem; line-height: 1.5; margin: 14px 0 0; }
    .status-card__link { display: none; margin-top: 20px; background: var(--gold); color: var(--ink); text-decoration: none; font-weight: 700; padding: 12px 24px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="status-card">
    <div class="status-card__spinner" id="spinner"></div>
    <h1 class="status-card__title" id="statusTitle">Проверяем оплату…</h1>
    <p class="status-card__text" id="statusText">Обычно это занимает несколько секунд. Не закрывайте страницу.</p>
    <p class="status-card__hint" id="earlyHint" hidden>Если оплата долго не подтверждается, эту страницу можно закрыть и открыть сайт заново — доступ откроется сам, повторно оплачивать не нужно.</p>
    <a class="status-card__link" id="homeLink" href="/">Вернуться на сайт</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const order = params.get("InvId") || params.get("order");
    const spinner = document.getElementById("spinner");
    const title = document.getElementById("statusTitle");
    const text = document.getElementById("statusText");
    const earlyHint = document.getElementById("earlyHint");
    const homeLink = document.getElementById("homeLink");

    // Те же тайминги, что на «Коде уважения» — см. feedback про мобильный
    // 3-D Secure и раннюю подсказку (ТЗ «Пересборки», раздел 7).
    const MAX_ATTEMPTS = 240;
    const INTERVAL_MS = 2500; // 240 * 2.5с = 10 минут
    const EARLY_HINT_ATTEMPT = 6;

    const PENDING_ORDER_STORAGE_KEY = "peresborkaPendingOrder";
    if (order) {
      try {
        localStorage.setItem(PENDING_ORDER_STORAGE_KEY, JSON.stringify({ invId: order, ts: Date.now() }));
      } catch {}
    }
    function clearPendingOrder() {
      try { localStorage.removeItem(PENDING_ORDER_STORAGE_KEY); } catch {}
    }

    function showTimeout() {
      spinner.style.display = "none";
      title.textContent = "Банк подтверждает платёж дольше обычного";
      text.textContent = "Такое бывает при проверке карты — доступ откроется сам, как только вы вернётесь на сайт. Закрыть эту страницу можно, повторно оплачивать не нужно.";
      homeLink.style.display = "inline-flex";
    }

    async function poll(attempt) {
      if (!order || attempt >= MAX_ATTEMPTS) return showTimeout();
      if (attempt === EARLY_HINT_ATTEMPT) earlyHint.hidden = false;

      try {
        const res = await fetch("/api/check-payment?order=" + encodeURIComponent(order));
        const data = await res.json();
        if (data.paid && data.accessToken) {
          title.textContent = "Оплата подтверждена";
          text.textContent = "Открываем доступ к каналу…";
          clearPendingOrder();
          window.location.href = "/?access=" + encodeURIComponent(data.accessToken);
          return;
        }
      } catch {}

      setTimeout(() => poll(attempt + 1), INTERVAL_MS);
    }

    poll(0);
  </script>
</body>
</html>
