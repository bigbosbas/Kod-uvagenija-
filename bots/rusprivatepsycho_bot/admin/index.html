<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Админ-панель</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-blue: #2563eb;
            --bg-color: #f4f4f5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #09090b;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .safe-pt { padding-top: env(safe-area-inset-top, 20px); }

        .premium-shadow {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .toggle-checkbox:checked {
            right: 0;
            border-color: #2563eb;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #2563eb;
        }

        #paySheetRoot {
            z-index: 60;
        }
        #grantSheetRoot {
            z-index: 65;
        }
        #paySheetRoot .pay-sheet-backdrop,
        #grantSheetRoot .pay-sheet-backdrop {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #paySheetRoot .pay-sheet-panel,
        #grantSheetRoot .pay-sheet-panel {
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }
        #paySheetRoot.pay-sheet-visible,
        #grantSheetRoot.pay-sheet-visible {
            pointer-events: auto;
        }
        #paySheetRoot.pay-sheet-visible .pay-sheet-backdrop,
        #grantSheetRoot.pay-sheet-visible .pay-sheet-backdrop {
            opacity: 1;
        }
        #paySheetRoot.pay-sheet-visible .pay-sheet-panel,
        #grantSheetRoot.pay-sheet-visible .pay-sheet-panel {
            transform: translateY(0);
        }

        .admin-pay-toolbar {
            background: #fff;
            border-radius: 1.5rem;
            border: 1px solid #f3f4f6;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            padding: 1rem 1rem 0.875rem;
            margin-bottom: 0.75rem;
        }
        .admin-pay-toolbar__meta {
            font-size: 0.875rem;
            color: #6b7280;
            margin: 0 0 0.75rem;
            line-height: 1.4;
        }
        .admin-pay-toolbar__meta strong {
            color: #111827;
            font-weight: 600;
        }
        .admin-pay-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .admin-pay-filter {
            margin: 0;
            padding: 0.5rem 0.875rem;
            border-radius: 0.75rem;
            font-size: 0.8125rem;
            font-weight: 500;
            font-family: inherit;
            border: 1px solid #e5e7eb;
            background: #fff;
            color: #1f2937;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            line-height: 1.2;
        }
        .admin-pay-filter:active {
            opacity: 0.85;
            transform: scale(0.98);
        }
        .admin-pay-filter--on {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }
        .admin-pay-list {
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
        }
        .admin-pay-card {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.75rem;
            background: #fff;
            padding: 0.875rem 1rem;
            border-radius: 1rem;
            border: 1px solid #f3f4f6;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }
        .admin-pay-card--pending {
            border-color: #e0e7ff;
            background: linear-gradient(180deg, #fafbff 0%, #fff 100%);
        }
        .admin-pay-card__left {
            min-width: 0;
            flex: 1;
        }
        .admin-pay-card__amount {
            font-size: 0.9375rem;
            font-weight: 600;
            color: #111827;
            margin: 0 0 0.25rem;
            line-height: 1.3;
        }
        .admin-pay-card__title {
            font-size: 0.8125rem;
            color: #6b7280;
            margin: 0;
            line-height: 1.35;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .admin-pay-card__hint {
            font-size: 0.6875rem;
            color: #6366f1;
            margin: 0.375rem 0 0;
            line-height: 1.35;
        }
        .admin-pay-card__right {
            text-align: right;
            flex-shrink: 0;
        }
        .admin-pay-card__uid {
            font-size: 0.8125rem;
            font-weight: 500;
            color: #111827;
            margin: 0 0 0.125rem;
        }
        .admin-pay-card__when {
            font-size: 0.75rem;
            color: #9ca3af;
            margin: 0;
        }
        .admin-pay-pagebar {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        .admin-pay-pagebar button {
            flex: 1;
            margin: 0;
            padding: 0.625rem 0.5rem;
            border-radius: 1rem;
            border: 1px solid #e5e7eb;
            background: #fff;
            font-size: 0.9375rem;
            font-family: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .admin-pay-pagebar button:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .admin-bc-card {
            background: #fff;
            border-radius: 1.5rem;
            border: 1px solid #f3f4f6;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        .admin-bc-card h3 {
            font-size: 0.9375rem;
            font-weight: 600;
            color: #111827;
            margin: 0 0 0.5rem;
        }
        .admin-bc-segments {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .admin-bc-seg {
            margin: 0;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            border: 1px solid #e5e7eb;
            background: #fff;
            text-align: left;
            font-size: 0.875rem;
            font-family: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            line-height: 1.35;
        }
        .admin-bc-seg small {
            display: block;
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.25rem;
            font-weight: 400;
        }
        .admin-bc-seg--on {
            border-color: #2563eb;
            background: #eff6ff;
            box-shadow: inset 0 0 0 1px #2563eb;
        }
        .admin-bc-text-shell {
            height: 200px;
            border: 1px solid #e5e7eb;
            border-radius: 1rem;
            background: #fafafa;
            overflow: hidden;
        }
        .admin-bc-text-shell textarea {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: none;
            background: transparent;
            padding: 0.75rem 1rem;
            font-size: 0.9375rem;
            font-family: inherit;
            line-height: 1.45;
            resize: none;
            outline: none;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .admin-bc-counter {
            font-size: 0.75rem;
            color: #6b7280;
            margin: 0.375rem 0 0;
            text-align: right;
        }
        .admin-bc-counter--warn {
            color: #dc2626;
        }
        .admin-bc-url-row {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background: #f9fafb;
            border-radius: 0.75rem;
            border: 1px solid #f3f4f6;
        }
        .admin-bc-url-row input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #e5e7eb;
            border-radius: 0.625rem;
            padding: 0.5rem 0.625rem;
            font-size: 0.8125rem;
            font-family: inherit;
        }
        .admin-bc-actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        .admin-bc-actions button {
            margin: 0;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            font-size: 0.9375rem;
            font-weight: 500;
            font-family: inherit;
            border: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .admin-bc-actions .admin-bc-secondary {
            background: #f3f4f6;
            color: #111827;
        }
        .admin-bc-actions .admin-bc-primary {
            background: #2563eb;
            color: #fff;
        }
        .admin-bc-actions .admin-bc-primary:disabled,
        .admin-bc-actions .admin-bc-secondary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .admin-bc-progress {
            margin-top: 0.75rem;
            padding: 1rem;
            border-radius: 1rem;
            font-size: 0.875rem;
            line-height: 1.5;
        }
        .admin-bc-progress--ok {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #14532d;
        }
        .admin-bc-progress--run {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: #1e3a8a;
        }
        .admin-bc-progress--err {
            background: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }
        .admin-bc-audience {
            font-size: 0.875rem;
            color: #374151;
            margin: 0.5rem 0 0;
        }
        .admin-bc-audience strong {
            color: #111827;
        }

        #subpage {
            min-height: 0;
        }
        #subpageContent {
            min-height: 0;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }
        .admin-settings-textarea--short {
            min-height: 5.5rem;
        }
        .admin-settings-textarea--long {
            min-height: 12rem;
            line-height: 1.45;
        }
    </style>
</head>
<body class="min-h-screen relative">

    <main id="mainScreen" class="w-full max-w-md mx-auto p-4 flex flex-col gap-5 safe-pb transition-transform duration-300">

        <header class="flex items-center justify-between pt-2 pb-2 safe-pt">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-gray-900">Админ-панель</h1>
                <p class="text-sm text-gray-500 font-medium mt-1" id="adminName">Управление ботом</p>
            </div>
            <div class="w-10 h-10 bg-blue-50 text-[var(--brand-blue)] rounded-full flex items-center justify-center">
                <i data-lucide="command" class="w-5 h-5"></i>
            </div>
        </header>

        <div class="bg-white rounded-3xl p-5 premium-shadow border border-gray-100 flex justify-between items-center admin-btn cursor-pointer active:scale-[0.98] transition-transform" data-target="Пользователи">
            <div>
                <p class="text-sm text-gray-500 mb-1 font-medium">Активных юзеров</p>
                <p class="text-3xl font-bold tracking-tight text-gray-900" id="statActiveCount">—</p>
            </div>
            <div class="bg-gray-100 p-3 rounded-2xl text-gray-800">
                <i data-lucide="bar-chart-2" class="w-6 h-6"></i>
            </div>
        </div>

        <section class="grid grid-cols-2 gap-3">
            <button type="button" class="admin-btn bg-white rounded-3xl p-4 flex flex-col items-start gap-3 premium-shadow border border-gray-100 active:scale-95 transition-all text-left" data-target="Все пользователи">
                <div class="bg-gray-100 text-gray-900 p-2.5 rounded-2xl"><i data-lucide="users" class="w-5 h-5"></i></div>
                <span class="font-medium text-[15px] text-gray-900">Пользователи</span>
            </button>

            <button type="button" class="admin-btn bg-white rounded-3xl p-4 flex flex-col items-start gap-3 premium-shadow border border-gray-100 active:scale-95 transition-all text-left" data-target="Активные">
                <div class="bg-blue-50 text-[var(--brand-blue)] p-2.5 rounded-2xl"><i data-lucide="user-check" class="w-5 h-5"></i></div>
                <span class="font-medium text-[15px] text-gray-900">Активные</span>
            </button>

            <button type="button" class="admin-btn bg-white rounded-3xl p-4 flex flex-col items-start gap-3 premium-shadow border border-gray-100 active:scale-95 transition-all text-left" data-target="Просроченные">
                <div class="bg-gray-100 text-gray-900 p-2.5 rounded-2xl"><i data-lucide="user-minus" class="w-5 h-5"></i></div>
                <span class="font-medium text-[15px] text-gray-900">Просроченные</span>
            </button>

            <button type="button" class="admin-btn bg-white rounded-3xl p-4 flex flex-col items-start gap-3 premium-shadow border border-gray-100 active:scale-95 transition-all text-left" data-target="Платежи">
                <div class="bg-gray-100 text-gray-900 p-2.5 rounded-2xl"><i data-lucide="credit-card" class="w-5 h-5"></i></div>
                <span class="font-medium text-[15px] text-gray-900">Платежи</span>
            </button>

            <button type="button" class="admin-btn bg-white rounded-3xl p-4 flex flex-col items-start gap-3 premium-shadow border border-gray-100 active:scale-95 transition-all text-left" data-target="Тарифы">
                <div class="bg-gray-100 text-gray-900 p-2.5 rounded-2xl"><i data-lucide="layers" class="w-5 h-5"></i></div>
                <span class="font-medium text-[15px] text-gray-900">Тарифы</span>
            </button>

            <button type="button" class="admin-btn bg-white rounded-3xl p-4 flex flex-col items-start gap-3 premium-shadow border border-gray-100 active:scale-95 transition-all text-left" data-target="Текст рассылки">
                <div class="bg-gray-100 text-gray-900 p-2.5 rounded-2xl"><i data-lucide="message-square" class="w-5 h-5"></i></div>
                <span class="font-medium text-[15px] text-gray-900">Рассылка</span>
            </button>

            <button type="button" class="admin-btn bg-white rounded-3xl p-4 flex flex-col items-start gap-3 premium-shadow border border-gray-100 active:scale-95 transition-all text-left" data-target="Поддержка">
                <div class="bg-gray-100 text-gray-900 p-2.5 rounded-2xl"><i data-lucide="life-buoy" class="w-5 h-5"></i></div>
                <span class="font-medium text-[15px] text-gray-900">Поддержка</span>
            </button>

            <button type="button" class="admin-btn bg-white rounded-3xl p-4 flex flex-col items-start gap-3 premium-shadow border border-gray-100 active:scale-95 transition-all text-left" data-target="Настройки">
                <div class="bg-gray-100 text-gray-900 p-2.5 rounded-2xl"><i data-lucide="settings" class="w-5 h-5"></i></div>
                <span class="font-medium text-[15px] text-gray-900">Настройки</span>
            </button>
        </section>
    </main>

    <div id="subpage" class="fixed inset-0 z-50 bg-[var(--bg-color)] transform translate-x-full transition-transform duration-300 ease-[cubic-bezier(0.32,0.72,0,1)] flex flex-col min-h-0 max-h-[100dvh]">
        <header class="bg-white px-4 py-3 flex items-center shadow-sm sticky top-0 z-10 safe-pt border-b border-gray-100">
            <button type="button" id="closeSubpageBtn" class="mr-3 p-2 -ml-2 text-[var(--brand-blue)] active:opacity-50">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <h2 id="subpageTitle" class="text-lg font-bold text-gray-900">Раздел</h2>
        </header>

        <div id="subpageContent" class="p-4 flex-1 min-h-0 overflow-y-auto overflow-x-hidden safe-pb flex flex-col gap-3 hide-scrollbar">
        </div>
    </div>

    <div id="paySheetRoot" class="fixed inset-0 pointer-events-none" aria-hidden="true">
        <button type="button" id="paySheetBackdrop" class="pay-sheet-backdrop absolute inset-0 z-0 w-full h-full bg-black/40 border-0 p-0 cursor-default"></button>
        <div class="pay-sheet-panel absolute bottom-0 left-0 right-0 z-10 max-w-md mx-auto w-full bg-[var(--bg-color)] rounded-t-3xl border border-gray-100 border-b-0 premium-shadow flex flex-col max-h-[75vh] pointer-events-auto"
             style="box-shadow: 0 -8px 40px rgba(0,0,0,0.12);">
            <div class="w-10 h-1 bg-gray-300 rounded-full mx-auto mt-3 mb-1 shrink-0"></div>
            <div class="px-4 py-3 flex items-center justify-between gap-2 border-b border-gray-100 bg-[var(--bg-color)] rounded-t-3xl">
                <div class="min-w-0">
                    <h3 class="text-lg font-bold text-gray-900 leading-tight">История оплат</h3>
                    <p id="paySheetUid" class="text-[13px] text-gray-500 font-medium truncate"></p>
                </div>
                <button type="button" id="paySheetClose" class="shrink-0 text-[var(--brand-blue)] text-[15px] font-semibold py-2 px-2 -mr-2 active:opacity-60">Готово</button>
            </div>
            <div id="paySheetBody" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 hide-scrollbar safe-pb">
            </div>
        </div>
    </div>

    <div id="grantSheetRoot" class="fixed inset-0 pointer-events-none" aria-hidden="true">
        <button type="button" id="grantSheetBackdrop" class="pay-sheet-backdrop absolute inset-0 z-0 w-full h-full bg-black/40 border-0 p-0 cursor-default"></button>
        <div class="pay-sheet-panel absolute bottom-0 left-0 right-0 z-10 max-w-md mx-auto w-full bg-[var(--bg-color)] rounded-t-3xl border border-gray-100 border-b-0 premium-shadow flex flex-col pointer-events-auto"
             style="box-shadow: 0 -8px 40px rgba(0,0,0,0.12);">
            <div class="w-10 h-1 bg-gray-300 rounded-full mx-auto mt-3 mb-1 shrink-0"></div>
            <div class="px-4 py-3 border-b border-gray-100 bg-[var(--bg-color)] rounded-t-3xl">
                <h3 id="grantSheetTitle" class="text-lg font-bold text-gray-900 leading-tight">Доступ вручную</h3>
                <p id="grantSheetUserLine" class="text-[13px] text-gray-500 font-medium truncate mt-0.5"></p>
            </div>
            <div class="p-4 flex flex-col gap-3 safe-pb">
                <label class="block">
                    <span class="text-[13px] font-medium text-gray-700 mb-1.5 block">Доступ до (дата)</span>
                    <input type="date" id="grantSheetDate" class="w-full bg-white border border-gray-200 rounded-2xl px-3 py-3 text-[15px] outline-none focus:border-[var(--brand-blue)]">
                </label>
                <p id="grantSheetHint" class="text-[12px] text-gray-500 leading-snug">Доступ действует до конца выбранного дня по Москве. После сохранения пользователю уйдёт сообщение со ссылкой в канал.</p>
                <div class="flex gap-2 pt-1">
                    <button type="button" id="grantSheetCancel" class="flex-1 bg-gray-100 text-gray-900 font-medium py-3 rounded-2xl text-[15px] active:scale-[0.98] transition-transform">Отмена</button>
                    <button type="button" id="grantSheetSave" class="flex-1 bg-[var(--brand-blue)] text-white font-medium py-3 rounded-2xl text-[15px] active:scale-[0.98] transition-transform">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/admin/app.js?v=7"></script>
</body>
</html>
