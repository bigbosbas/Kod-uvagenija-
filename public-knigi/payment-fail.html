<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Оплата не завершена — книги Руслана Нагайченко</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=6" />
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .status-card { max-width: 440px; width: 100%; background: var(--white); border: 1px solid var(--divider); border-radius: 20px; padding: 40px 32px; text-align: center; box-shadow: 0 30px 60px -30px rgba(11,24,33,0.35); }
    .status-card__title { font-family: var(--font-display); font-weight: 600; font-size: 1.9rem; line-height: 1.1; margin: 0 0 12px; }
    .status-card__text { color: var(--muted); font-family: var(--font-ui); font-size: 0.92rem; line-height: 1.6; margin: 0 0 24px; }
  </style>
</head>
<body>
  <div class="status-card">
    <h1 class="status-card__title">Оплата не прошла</h1>
    <p class="status-card__text">Платёж был отменён или не завершён. Деньги не списаны — можете попробовать ещё раз.</p>
    <a class="btn btn--primary" href="./#choose">Вернуться к выбору книги</a>
  </div>
</body>
</html>
